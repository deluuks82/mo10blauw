2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}\n/* ===== Navigatie onderin ===== */\n.tabs{flex-shrink:0;position:relative;z-index:60;display:flex;justify-content:space-around;align-items:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#111;border-top:1px solid rgba(255,255,255,.08)}\n.tab{flex:1;max-width:76px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:15px;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);transition:background .15s,color .15s}\n.tab svg.i{width:21px;height:21px}\n.tab.active{color:#fff;background:var(--green)}\n.page{display:none;height:100%}.page.active{display:block}\n.scroll-page{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:16px}\n/* ===== Overzicht ===== */\n.hero{background:#111;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 86px;position:relative;overflow:hidden}\n.hero:before{content:\"\";position:absolute;right:-70px;top:-50px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(0,120,86,.55),rgba(0,120,86,0) 70%);pointer-events:none}\n.brand{display:flex;align-items:center;gap:12px;position:relative}\n.logo{width:48px;height:58px;object-fit:contain;flex-shrink:0}\n.club{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--green-text);text-transform:uppercase}\n.team{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1.1}\n.season{font-size:12px;color:rgba(255,255,255,.5);margin-top:1px;font-weight:600}\n.kpis{display:flex;gap:8px;margin-top:16px;position:relative}\n.kpi{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px}\n.kpi b{font-size:21px;font-weight:900;display:block;line-height:1.1}.kpi span{font-size:11px;color:rgba(255,255,255,.6);font-weight:700}\n.next{margin:-70px 14px 0;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;position:relat size:10.5px;font-weight:700}\n.bottom img{width:18px;height:22px;object-fit:contain;opacity:.8}\n/* ===== Veld-pagina (opstelling + wedstrijd) ===== */\n#page-veld{background:var(--dark);overflow:hidden;flex-direction:column;padding-top:env(safe-area-inset-top)}\n#page-veld.active{display:flex}\n.op-topbar{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;flex-shrink:0}\n.op-title{display:none}\n.sel-card{flex:1;min-width:0;background:var(--card-d);border-radius:14px;padding:7px 12px;position:relative}\n.sel-card small{display:block;font-size:9.5px;color:var(--green-text);font-weight:800;letter-spacing:.08em;text-transform:uppercase}\n.picker{display:block;width:100%;background:transparent;color:#fff;border:0;font-family:inherit;font-size:14px;font-weight:800;padding:1px 0;-webkit-appearance:none;appearance:none;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.picker option{background:#1a1a1a;color:#fff}\n.ib{width:44px;height:44px;border-radius:14px;background:var(--card-d);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.ib.g{background:var(--green)}\n/* HUD wedstrijd */\n.hud{display:none;flex-shrink:0;margin:10px 10px 6px;background:var(--card-d);border-radius:22px;padding:12px;color:#fff;position:relative}\nbody.match .hud{display:block}\nbody.match .op-topbar{display:none}\n.hrow{display:flex;align-items:center;gap:7px}\n.clock{flex:1;min-width:0}\n.clock small{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--green-text);text-transform:uppercase}\n.clock strong{display:block;font-size:40px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}\n.clock strong.warn{color:#F87171}\n.sm{width:46px;height:46px;border-radius:14px;background:#2A2A2A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:rgba(255,255,255,.7);gap:2px;flex-shrink:0}\n.sm svg.i{width:17px;height:17px;stroke:#fff;stroke-width:2.2}\n.sm:disabled{opacity:.35}\n.play{width:58px;height:58px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(0,120,86,.45);color:#fff}\n.play svg{width:24px;height:24px;fill:currentColor}\n.play.running{background:#FACC15;color:#111;box-shadow:0 4px 14px rgba(250,204,21,.35)}\n.prog{height:4px;background:#2E2E2E;border-radius:4px;margin-top:10px;overflow:hidden}\n.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:4px;transition:width .4s linear}\n.menu{display:none;position:absolute;right:76px;top:62px;z-index:30;background:#2A2A2A;border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:190px}\n.menu.open{display:block}\n.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:800;color:#fff;text-align:left}\n.menu button.danger{color:#F87171}\n.menu button:active{background:#333}\n.shoot{display:flex;align-items:center;gap:7px;margin-top:10px;background:var(--card-d2);border-radius:16px;padding:8px 8px 8px 12px}\n.shoot-info{flex:1;min-width:0}\n.shoot-info small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.08em;color:#FDE047;text-transform:uppercase}\n.shoot-info b{display:block;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.shoot-info em{display:block;font-style:normal;font-size:10.5px;color:rgba(255,255,255,.5);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.btn-s{height:42px;border-radius:12px;padding:0 11px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;white-space:nowrap;flex-shrink:0}\n.btn-s.skip{border:1.5px solid #444;color:#fff}\n.btn-s.go{background:var(--green);color:#fff}\n.btn-s.icon{width:42px;padding:0;background:#2E2E2E;color:#fff}\n.match-hint{display:none;flex-shrink:0;margin:6px -color:#FB7185\"><\/i>Voor<\/span><span class=\"tip\">Sleep om te verplaatsen · tik voor foto<\/span>\n  <\/div>\n<\/section>\n\n<div class=\"page scroll-page\" id=\"page-spelregels\">\n  <div class=\"page-head\"><small>KNHB · O10<\/small><b>Spelregels<\/b><span>8 tegen 8 · onder 10 jaar<\/span><\/div>\n  <div class=\"spelregels-page\">\n    <div class=\"spelregels-header\"><div class=\"sr-title\">📚 Spelregels O10<\/div><div class=\"sr-sub\">KNHB · 8 tegen 8 · Onder 10 jaar<\/div><\/div>\n    <div class=\"sr-intro\"><div class=\"sr-intro-pills\">\n      <span class=\"sr-pill\">8 vs 8 incl. keeper<\/span><span class=\"sr-pill\">2x30 min · 5 min rust<\/span>\n      <span class=\"sr-pill\">55x43 m veld<\/span><span class=\"sr-pill\">Geen ranglijst<\/span>\n    <\/div><\/div>\n    <div class=\"sr-rules\">\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Beginslag<\/div><div class=\"sr-rule-body\">Vanaf het midden op de middenlijn. Self-pass, push of schuifslag. Beide teams op eigen helft. Tegenpartij houdt 5 meter afstand.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Doelpunt<\/div><div class=\"sr-rule-body\">Aanvaller raakt bal in cirkel aan, op of onder plankhoogte volledig over achterlijn. Bal mag niet hoger dan plank- of kniehoogte tijdens schotbaan.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Gevaarlijk spel<\/div><div class=\"sr-rule-body\">Bal niet hoger dan kniehoogte. Liften mag, mits niet gevaarlijk. Speelbegeleider beoordeelt.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Spelhervattingen<\/div><div class=\"sr-rule-body\">Alle spelers 5 meter afstand. Bal binnen 5 meter van cirkel genomen? Eerst 5 meter rollen voor de cirkel in.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Inslag<\/div><div class=\"sr-rule-body\">Bal over de zijlijn: genomen op die plek. Iedereen 5 meter afstand.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Vrije slag<\/div><div class=\"sr-rule-body\">Bij overtreding op die plek. Aanvallende overtreding in doelgebied: verdediger neemt bal ter hoogte van kop cirkel. Verdedigende overtreding binnen 5 meter van doel: vrije slag voor aanvaller, bal eerst 5 meter rollen.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Shoot-out<\/div><div class=\"sr-rule-body\">Bij verdedigende overtreding in cirkel. Geen tijdslimiet. Alle spelers behalve keeper en schutter in aanvallende cirkel. Schot vanaf middenlijn na fluitsignaal.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Strafbal<\/div><div class=\"sr-rule-body\">Doelpunt voorkomen door overtreding verdediger. Tijd wordt stilgezet.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Uitslaan<\/div><div class=\"sr-rule-body\">Bal over achterlijn: hervat recht tegenover die plek ter hoogte van kop cirkel.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Lange corner<\/div><div class=\"sr-rule-body\">Bal onopzettelijk via verdediger over achterlijn: hervat ca. 5 meter achter 15 meter lijn. Bal eerst 5 meter rollen. Beide teams 5 meter afstand.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Shoot &amp; bolle kant<\/div><div class=\"sr-rule-body\">Niet met voet of bolle kant spelen.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Time-out<\/div><div class=\"sr-rule-body\">Door teambegeleider of speelbegeleider aan te vragen voor extra aanwijzingen.<\/div><\/div>\n      <div class=\"sr-rule\"><div class=\"sr-rule-title\">Bully<\/div><div class=\"sr-rule-body\">Bij onderbreking door blessure zonder overtreding, om spel te hervatten.<\/div><\/div>\n    <\/div>\n    <div class=\"sr-footer\">\n      <div class=\"sr-footer-item\"><div class=\"sr-footer-icon\">🏏<\/div><div class=\"sr-footer-text\"><b>Coach:<\/b> Enthousiasmeren en veilige speelomgeving creëren.<\/div><\/div>\n      <d nfunction changeScore(side,delta){var s=scoreState();s[side]=Math.max(0,s[side]+delta);save(K_SCORE,s);updateScore();}\nfunction updateScore(){var s=scoreState(),u=$(\"score-us\"),t=$(\"score-them\");if(u)u.textContent=s.us;if(t)t.textContent=s.them;}\nfunction clockState(){var c=load(K_CLOCK,null);if(!c)c={half:1,elapsed:0,running:false,runAt:null,started:false,bench:{}};c.bench=c.bench||{};return c;}\nfunction elapsed(c){return Math.min(HALF_MS,c.elapsed+(c.running&&c.runAt?Date.now()-c.runAt:0));}\nfunction fmt(ms){var s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+\":\"+(\"0\"+s%60).slice(-2);}\nfunction fmtLeft(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+\":\"+(\"0\"+s%60).slice(-2);}\n// Wisseltijd: per speelster totaal + sinds-moment (alleen tijdens lopende klok op de bank)\nfunction syncBench(c,now){\n  players().forEach(function(s){\n    var b=c.bench[s.name]||(c.bench[s.name]={total:0,since:null}),onBench=zoneOf(s.name)===\"wissel\";\n    if(c.running&&onBench){if(b.since===null)b.since=now;}\n    else if(b.since!==null){b.total+=Math.max(0,now-b.since);b.since=null;}\n  });\n}\nfunction benchMs(c,n){var b=c.bench[n];if(!b)return 0;return b.total+(b.since!==null&&c.running?Date.now()-b.since:0);}\nfunction toggleClock(){\n  var c=clockState(),now=Date.now();\n  if(c.running){c.elapsed=elapsed(c);c.running=false;c.runAt=null;syncBench(c,now);save(K_CLOCK,c);toast(\"Gepauzeerd\");}\n  else{\n    if(elapsed(c)>=HALF_MS){toast(c.half===1?\"Helft voorbij · tik Rust\":\"Wedstrijd is afgelopen\");return;}\n    if(!c.started){c.started=true;save(K_START,positions);save(K_SHOOT,null);save(K_ORDER,newOrder());}\n    c.running=true;c.runAt=now;syncBench(c,now);save(K_CLOCK,c);toast(c.elapsed?\"Hervat\":\"Wedstrijd gestart\");\n  }\n  updateHud();\n}\nfunction nextHalf(){\n  var c=clockState(),now=Date.now();\n  if(c.half===2&&elapsed(c)>=HALF_MS){toast(\"Wedstrijd is al afgelopen\");return;}\n  var msg=c.half===1?\"Naar de rust en de 2 >\n  <div class=\"op-main\">\n    <div class=\"dugout\" id=\"dugout\">\n      <div class=\"dug-sec wissel\" data-zone=\"wissel\"><div class=\"dug-label\">Wissel<\/div><div class=\"slots\" id=\"slots-wissel\"><\/div><\/div>\n      <button type=\"button\" class=\"order-toggle\" id=\"order-toggle\" aria-expanded=\"false\">Volgorde <span class=\"order-arrow\">▼<\/span><\/button>\n      <div class=\"dug-sec volgorde\"><div class=\"dug-label\">Volgorde<\/div><div class=\"order-list\" id=\"order-list\"><\/div><div class=\"order-more\" id=\"order-more\">▼<\/div><\/div>\n      <div class=\"dug-sec coach\" data-zone=\"coach\"><div class=\"dug-label\">Coach<\/div><div class=\"slots\" id=\"slots-coach\"><\/div><\/div>\n      <div class=\"dug-sec afgemeld\" data-zone=\"afgemeld\"><div class=\"dug-label\">Afgemeld<\/div><div class=\"slots\" id=\"slots-afgemeld\"><\/div><\/div>\n    <\/div>\n    <div class=\"stage\" id=\"stage\">\n      <div class=\"veld\" id=\"veld\">\n        <svg id=\"veld-svg\" viewBox=\"0 0 800 400\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><g id=\"veld-g\" fill=\"none\" stroke=\"#C8E2FF\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<rect x=\"18\" y=\"18\" width=\"764\" height=\"364\" rx=\"2\" stroke-width=\"4\" opacity=\".95\"><\/rect>\n<line x1=\"400\" y1=\"18\" x2=\"400\" y2=\"382\" stroke-width=\"3.5\" opacity=\".95\"><\/line>\n<path d=\"M18 72 L18 328\" stroke-width=\"7\" opacity=\".5\"><\/path><path d=\"M782 72 L782 328\" stroke-width=\"7\" opacity=\".5\"><\/path>\n<path d=\"M18 80 A120 120 0 0 1 138 200 A120 120 0 0 1 18 320\" stroke-width=\"4\"><\/path>\n<path d=\"M782 80 A120 120 0 0 0 662 200 A120 120 0 0 0 782 320\" stroke-width=\"4\"><\/path>\n<path d=\"M18 42 A158 158 0 0 1 176 200 A158 158 0 0 1 18 358\" stroke-width=\"3\" stroke-dasharray=\"10 19\" opacity=\".9\"><\/path>\n<path d=\"M782 42 A158 158 0 0 0 624 200 A158 158 0 0 0 782 358\" stroke-width=\"3\" stroke-dasharray=\"10 19\" opacity=\".9\"><\/path>\n<rect x=\"0\" y=\"174\" width=\"18\" height=\"52\" stroke=\"#fff\" stroke-width=\"4\" opacity=\".95\"><\/rect><rect x=\"782\" y=\"174\" width=\"18\" height=\"52\" stroke=\"#fff\" stroke-width=\"4\" opacity=\".95\"><\/rect>\n<line x1=\"18\" y1=\"62\" x2=\"8\" y2=\"62\" stroke-width=\"3\"><\/line><line x1=\"18\" y1=\"338\" x2=\"8\" y2=\"338\" stroke-width=\"3\"><\/line><line x1=\"782\" y1=\"62\" x2=\"792\" y2=\"62\" stroke-width=\"3\"><\/line><line x1=\"782\" y1=\"338\" x2=\"792\" y2=\"338\" stroke-width=\"3\"><\/line>\n<\/g><\/svg>\n        <div class=\"hulp\" id=\"hulp\"><div class=\"lh\"><\/div><div class=\"lv\"><\/div><div class=\"ring\"><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"match-hint\" id=\"match-hint\"><\/div>\n  <div class=\"legend\">\n    <span><i style=\"border-color:#FDE047\"><\/i>Keeper<\/span><span><i style=\"border-color:#60A5FA\"><\/i>Achter<\/span><span><i style=\"border-color:#C4B5FD\"><\/i>Midden<\/span><span><i style=\"border-color:#FB7185\"><\/i>Voor<\/span><span class=\"tip\">Sleep om te verplaatsen · tik voor foto<\/span>\n  <\/div>\n<\/section>\n\n<div class=\"page scroll-page\" id=\"page-spelregels\">\n  <div class=\"page-head\"><small>KNHB · O10<\/small><b>Spelregels<\/b><span>6 tegen 6 · onder 10 jaar<\/span><\/div>\n  <div class=\"spelregels-page\">\n    <div class=\"spelregels-header\"><div class=\"sr-title\">📚 Spelregels O10<\/div><div class=\"sr-sub\">KNHB · 6 tegen 6 · Onder 10 jaar<\/div><\/div>\n    <div class=\"sr-intro\"><div class=\"sr-intro-pills\">\n      <span class=\"sr-pill\">6 vs 6 incl. keeper<\/span><span class=\"sr-pill\">2x15 min · 3 min rust<\/span>\n      <span class=\"sr-pill\">40x20 m zaal<\/span><span class=\"sr-pill\">Geen ranglijst<\/span>\n    <\/div><\/div>\n    <div class=\"sr-rules\">\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Beginpush<\/div><div class=\"sr-rule-body\">Vanaf het midden op de middellijn. Dit kan met een push of self-pass, naar voren of naar achteren. Beide teams starten op eigen helft. De tegenpartij houdt 3 meter afstand.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Spelen van de bal<\/div><div class=\"sr-rule-body\">De bal wordt over de grond gespeeld met een push. Een licht stuiterende bal na het stoppen is toegestaan. Alleen bij een push op doel mag de bal hoog, maximaal kniehoogte. Veiligheid staat voorop.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Doelpunt<\/div><div class=\"sr-rule-body\">Een doelpunt telt wanneer een aanvaller de bal in de cirkel heeft aangeraakt en de bal volledig over de doellijn gaat. Daarna volgt een beginpush vanaf het midden.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Spelhervattingen<\/div><div class=\"sr-rule-body\">Alle spelers houden 3 meter afstand. Wordt de bal binnen 3 meter van de cirkel genomen, dan moet de bal eerst 3 meter rollen voordat deze de cirkel in mag.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Inpush<\/div><div class=\"sr-rule-body\">Gaat de bal over de balk, dan wordt de bal genomen waar deze over de balk ging. Dit mag ongeveer 1 meter van de balk. Dicht bij de cirkel moet de bal eerst 3 meter rollen.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Uitpush<\/div><div class=\"sr-rule-body\">Gaat de bal via de aanvallende partij over de achterlijn, dan neemt de verdediging de bal recht tegenover dat punt, niet verder dan de kop van de cirkel.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Lange corner<\/div><div class=\"sr-rule-body\">Gaat de bal onopzettelijk via een verdediger over de achterlijn, dan neemt de aanval de lange corner op de middenlijn, recht tegenover die plek. De bal moet eerst 3 meter rollen.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Vrije push<\/div><div class=\"sr-rule-body\">Na een overtreding krijgt het andere team een vrije push op de plek van de overtreding.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Shoot-out<\/div><div class=\"sr-rule-body\">Bij een verdedigende overtreding in de cirkel kan een shoot-out worden gegeven. Keeper en nemer starten bij het doel en de middenlijn. De overige spelers staan in de aanvallende cirkel en mogen na het fluitsignaal meedoen.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Strafbal<\/div><div class=\"sr-rule-body\">Wanneer een doelpunt door een overtreding van een verdediger wordt voorkomen, wordt een strafbal gegeven.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Voet en bolle kant<\/div><div class=\"sr-rule-body\">De bal mag niet met de voet of met de bolle kant van de stick worden gespeeld.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Bully<\/div><div class=\"sr-rule-body\">Na een onderbreking zonder overtreding, bijvoorbeeld bij een blessure, kan het spel met een bully worden hervat.<\/div><\/div>\n<div class=\"sr-rule\"><div class=\"sr-rule-title\">Begeleiding<\/div><div class=\"sr-rule-body\">De wedstrijd wordt begeleid door twee speelbegeleiders: één van de thuisvereniging en één van de uitvereniging. Zij staan aan weerszijden in het veld.<\/div><\/div>\n<\/div>\n    <div class=\"sr-footer\">\n      <div class=\"sr-footer-item\"><div class=\"sr-footer-icon\">🏏<\/div><div class=\"sr-footer-text\"><b>Coach:<\/b> Enthousiasmeren en veilige speelomgeving creëren.<\/div><\/div>\n      <div class=\"sr-footer-item\"><div class=\"sr-footer-icon\">👏<\/div><div class=\"sr-footer-text\"><b>Ouders:<\/b> Positief aanmoedigen.<\/div><\/div>\n      <div class=\"sr-footer-item\"><div class=\"sr-footer-icon\">🔗<\/div><div class=\"sr-footer-text\"><b>Meer info:<\/b> Officiële KNHB-spelregels zaal O10<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n\n<section class=\"page scroll-page\" id=\"page-team\">\n  <div class=\"page-head\"><small>MHC Alliance<\/small><b>Team<\/b><span>Taken, speelsters en instellingen<\/span><\/div>\n  <div class=\"
