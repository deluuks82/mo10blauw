function b64(s){var p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function setOn(on){btn.classList.toggle("on",on);lbl.textContent=on?"Meldingen aan":"Meldingen aanzetten"}
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;

btn.hidden=false;
if(!supported){setOn(false);btn.addEventListener("click",function(){msg(ios&&!standalone?"Op iPhone: tik op Deel → ‘Zet op beginscherm’ en open de pagina vanaf je beginscherm. Daarna kun je meldingen aanzetten.":"Deze browser ondersteunt geen meldingen.",7000)});return}
var regP=navigator.serviceWorker.register("./sw.js");
regP.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){setOn(!!sub&&Notification.permission==="granted")}).catch(function(){});
async function save(sub){var j=sub.toJSON(),row={endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth};
 var r=await sb.from("push_subscriptions").upsert(row,{onConflict:"endpoint"});
 if(r.error){var r2=await sb.from("push_subscriptions").insert(row);if(r2.error&&r2.error.code!=="23505")throw r2.error}}
btn.addEventListener("click",async function(){
 try{
  if(btn.classList.contains("on")){msg("Meldingen staan al aan voor dit toestel.");return}
  var perm=await Notification.requestPermission();
  if(perm!=="granted"){msg("Meldingen zijn geweigerd. Zet ze aan via de instellingen van je telefoon.",6000);return}
  var reg=await regP;await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
  await save(sub);setOn(true);msg("Meldingen staan aan 🏑")
 }catch(e){console.error(e);msg("Aanzetten mislukt: "+(e&&e.message||e),7000)}
});
})();
